name: Diagnostic - inspect the official ComfyUI image's real entrypoint/cmd

# One-off, zero-real-money diagnostic (no GPU, no Runpod API calls - just
# `docker pull` + `docker inspect` on a GitHub-hosted runner). Needed
# because the Claude Code session building the watchdog-integrated custom
# image has no Docker daemon and is rate-limited by Docker Hub from its
# own shared egress IP - this runner has neither problem. Real findings
# here decide exactly how the custom Dockerfile wraps the base image's
# own startup without breaking it (never guessed/replaced blind).
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and inspect the real image config
        run: |
          docker pull runpod/comfyui:1.3.3-comfyuiv0.30.0-cuda13.0
          echo "=== Entrypoint/Cmd/WorkingDir/Env (real, from the image itself) ==="
          docker inspect --format '{{json .Config}}' runpod/comfyui:1.3.3-comfyuiv0.30.0-cuda13.0 | python3 -m json.tool
          echo "=== History (to see how CMD/ENTRYPOINT were set across layers) ==="
          docker history --no-trunc runpod/comfyui:1.3.3-comfyuiv0.30.0-cuda13.0 | head -40
