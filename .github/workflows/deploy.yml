name: Deploy to droplet

# Owner's instruction, 2026-10-20 ("اريد ان استغنى عنك في التصليح و
# الاصلاح و التحسين... و هل استغنى عنك للابد؟" - I want to not need you
# for every fix/redeploy): this ends the manual copy-paste-into-the-
# DigitalOcean-console deploy loop that every single fix tonight needed.
# It does NOT write code fixes by itself - a real fix still needs to be
# committed first, same as every commit in this repo's history. All this
# does is run, automatically, the exact same commands the owner was
# pasting by hand all night: git pull, docker compose up -d --build,
# then print the post-deploy logs so a failure is visible in the GitHub
# Actions run itself, not only discovered later from a silent bot.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Real collision found live, 2026-10-20: a push-triggered run and a manual
# workflow_dispatch run against the same commit landed on the droplet at
# the same moment. Both ran `docker compose up -d --build` concurrently;
# the second one's `docker rename` step hit the first one's container
# still mid-recreate - "Conflict. The container name
# ...nexus-studio-nexus-studio-1 is already in use" - and failed outright,
# visible as a real red run with no code at fault. `cancel-in-progress:
# false` queues a second run instead of cancelling (a cancelled run could
# land between `docker compose up -d --build` starting the new container
# and `docker compose logs` reading it, silently losing the log evidence
# this workflow exists to produce) or racing it (this incident).
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        # Owner added a real Replicate API token as a GitHub repository
        # secret, 2026-10-21, specifically so it never has to be typed
        # into a chat or stored anywhere but GitHub's own encrypted
        # secret store and the real .env file on the droplet - the exact
        # thing the FAL_KEY/GROQ_API_KEY/etc. keys already do. `envs:`
        # below is appleboy/ssh-action's own documented mechanism for
        # forwarding a step-level env var into the remote script's shell
        # environment (verified against the action's own README,
        # 2026-10-21) - this value is never printed by this workflow.
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          # Owner's instruction, 2026-10-22 ("نعم" to continuing the
          # wiring): same real secret-sync mechanism as
          # REPLICATE_API_TOKEN above, for the self-hosted Wan 2.2 S2V
          # engine (src/integrations/self_hosted_video_client.py) - see
          # docs/SOURCES.md "Self-hosted Wan 2.2 S2V: a real cinematic
          # clip, proven end to end".
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S2V_POD_ID: ${{ secrets.RUNPOD_S2V_POD_ID }}
          # Owner's explicit instruction, 2026-10-23 ("فعل" - activate it),
          # given directly after personally viewing the real two-speaker
          # proof this exact deploy pipeline produced: the earlier
          # "never auto-sync this, only a manual .env edit" design assumed
          # the owner would edit .env on the droplet themselves, which this
          # project has no real path for (no SSH access from a coding
          # session, and the owner has never done manual droplet work
          # since this very deploy.yml was built specifically to end that
          # - see this file's own opening comment). Synced the SAME real
          # way REPLICATE_API_TOKEN/RUNPOD_API_KEY/RUNPOD_S2V_POD_ID
          # already are: a GitHub repository secret the owner sets once
          # through GitHub's own UI, the same action they already took for
          # those three real keys.
          MULTITALK_ENABLED: ${{ secrets.MULTITALK_ENABLED }}
          # Owner's explicit instruction, 2026-10-24 (set
          # CINEMATIC_SHOTS_ENABLED=true in .env and restart): same
          # GitHub-secret sync as MULTITALK_ENABLED above, since a coding
          # session has no SSH path to edit .env on the droplet directly.
          # Each line of a cinematic episode adds one paid image.
          # Real runs #97-#99 (2026-10-24) received this secret EMPTY even
          # after the owner saved it, so the owner chose (decision card,
          # 2026-10-24) to default it to true here; a secret set to
          # "false" still turns it off.
          CINEMATIC_SHOTS_ENABLED: ${{ secrets.CINEMATIC_SHOTS_ENABLED || 'true' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REPLICATE_API_TOKEN,RUNPOD_API_KEY,RUNPOD_S2V_POD_ID,MULTITALK_ENABLED,CINEMATIC_SHOTS_ENABLED
          script: |
            set -e
            cd ~/nexus-studio
            # Restored to the real deploy script, 2026-10-21. The two
            # commits above this one (40617e4, 9edbc6f) temporarily made
            # this step read-only - no restart, no rebuild - specifically
            # because the owner had a real, possibly in-flight /full call
            # at that exact moment, and restarting the container would
            # have killed it outright (the exact mistake already made
            # twice that same night). That risk has passed; this step is
            # back to doing what every commit message since the first one
            # has described: pull, rebuild, restart, print the real
            # post-deploy logs so a failure is visible in the run itself.
            # Keeps .env's REPLICATE_API_TOKEN line in sync with the real
            # GitHub secret on every deploy - upserted (replaced if the
            # line already exists, appended if not), never printed. This
            # runs BEFORE the rebuild below so a freshly-added token is
            # already in .env the moment the container that reads it starts.
            if [ -n "${REPLICATE_API_TOKEN:-}" ]; then
              if grep -q "^REPLICATE_API_TOKEN=" .env 2>/dev/null; then
                sed -i "s|^REPLICATE_API_TOKEN=.*|REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}|" .env
              else
                echo "REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}" >> .env
              fi
            fi
            if [ -n "${RUNPOD_API_KEY:-}" ]; then
              if grep -q "^RUNPOD_API_KEY=" .env 2>/dev/null; then
                sed -i "s|^RUNPOD_API_KEY=.*|RUNPOD_API_KEY=${RUNPOD_API_KEY}|" .env
              else
                echo "RUNPOD_API_KEY=${RUNPOD_API_KEY}" >> .env
              fi
            fi
            if [ -n "${RUNPOD_S2V_POD_ID:-}" ]; then
              if grep -q "^RUNPOD_S2V_POD_ID=" .env 2>/dev/null; then
                sed -i "s|^RUNPOD_S2V_POD_ID=.*|RUNPOD_S2V_POD_ID=${RUNPOD_S2V_POD_ID}|" .env
              else
                echo "RUNPOD_S2V_POD_ID=${RUNPOD_S2V_POD_ID}" >> .env
              fi
            fi
            if [ -n "${MULTITALK_ENABLED:-}" ]; then
              if grep -q "^MULTITALK_ENABLED=" .env 2>/dev/null; then
                sed -i "s|^MULTITALK_ENABLED=.*|MULTITALK_ENABLED=${MULTITALK_ENABLED}|" .env
              else
                echo "MULTITALK_ENABLED=${MULTITALK_ENABLED}" >> .env
              fi
            fi
            if [ -n "${CINEMATIC_SHOTS_ENABLED:-}" ]; then
              if grep -q "^CINEMATIC_SHOTS_ENABLED=" .env 2>/dev/null; then
                sed -i "s|^CINEMATIC_SHOTS_ENABLED=.*|CINEMATIC_SHOTS_ENABLED=${CINEMATIC_SHOTS_ENABLED}|" .env
              else
                echo "CINEMATIC_SHOTS_ENABLED=${CINEMATIC_SHOTS_ENABLED}" >> .env
              fi
            fi
            git pull origin main
            # --force-recreate (owner's instruction, 2026-10-24: a full,
            # clean restart on every deploy): the container is replaced
            # even when compose sees no config change.
            # --no-cache (owner's instruction, 2026-10-24: a clean deploy
            # with the cache fully cleared): every image layer is rebuilt
            # from scratch, nothing reused from an earlier build.
            docker compose build --no-cache nexus-studio
            docker compose up -d --force-recreate nexus-studio
            sleep 8
            docker compose logs --tail=30 nexus-studio
            # Owner's concern, 2026-10-24: "the server ignores the new code
            # and reads an old cached copy". Proven here on every deploy,
            # not assumed: the source files INSIDE the running container
            # are hashed and compared with the same files in the repo
            # checkout that was just pulled.
            echo "=== running code vs repo (commit $(git rev-parse --short HEAD)) ==="
            CODE_FILES="src/app.py src/config.py src/workflows/dialogue_pipeline.py src/agents/shot_director.py src/agents/dialogue_writer.py src/integrations/replicate_image_client.py src/bot/conversation.py src/workflows/shot_prompt_compiler.py src/integrations/tts_client.py src/workflows/wan_s2v_prompt_builder.py src/integrations/self_hosted_video_client.py"
            REPO_SUM=$(cat $CODE_FILES | sha256sum | cut -d' ' -f1)
            CONTAINER_SUM=$(docker compose exec -T nexus-studio sh -c "cat $CODE_FILES" | sha256sum | cut -d' ' -f1)
            if [ "$REPO_SUM" = "$CONTAINER_SUM" ]; then
              echo "MATCH: the container runs exactly the repo's code ($REPO_SUM)"
            else
              echo "MISMATCH: repo $REPO_SUM, container $CONTAINER_SUM"
            fi
            if docker compose exec -T nexus-studio sh -c '[ -n "$CINEMATIC_SHOTS_ENABLED" ]'; then
              echo "CINEMATIC_SHOTS_ENABLED: present inside the running container"
            else
              echo "CINEMATIC_SHOTS_ENABLED: NOT present inside the running container"
            fi
            # Owner's own real question, 2026-10-21 ("و اين groq؟ اليس
            # واحد منهم احتياطي؟" - where is Groq, isn't one of them the
            # backup?): .env lives only on this real droplet, never in
            # GitHub (gitignored, never committed) and never readable from
            # a coding session with no SSH access to this server - the
            # only honest way to answer "is this key really configured"
            # is to check it HERE, on the real deploy run, every time.
            # Never prints a key's real value - only whether the line in
            # .env has anything after the "=" at all.
            echo "=== real key presence in .env (values never printed) ==="
            for k in GROQ_API_KEY GEMINI_API_KEY AZURE_SPEECH_KEY TELEGRAM_BOT_TOKEN REPLICATE_API_TOKEN RUNPOD_API_KEY RUNPOD_S2V_POD_ID; do
              if grep -q "^${k}=..*" .env 2>/dev/null; then
                echo "$k: SET"
              else
                echo "$k: EMPTY or MISSING"
              fi
            done
            # Owner's real, live concern, 2026-10-21 ("لكن في رصيدي اقل
            # من 8 دولار" - my real fal.ai balance is under $8): produce()'s
            # own real-spend ceiling (MAX_EPISODE_COST_USD) defaults to
            # $10.0 in config.py if unset - HIGHER than his real balance.
            # This is not a secret/credential, just a number - printed in
            # full, unlike the keys above, so it can be checked against a
            # real account balance before ever pressing Approve.
            echo "=== real spend ceiling (MAX_EPISODE_COST_USD) ==="
            if grep -q "^MAX_EPISODE_COST_USD=..*" .env 2>/dev/null; then
              grep "^MAX_EPISODE_COST_USD=" .env
            else
              echo "MAX_EPISODE_COST_USD: not set in .env - config.py's own default (10.0) is in effect"
            fi
            # Owner's explicit instruction, 2026-10-23 ("فعل"), given
            # after personally viewing the real two-speaker proof - see
            # the real secret-sync block above for why this moved from
            # "owner edits .env by hand" (a path this project has never
            # actually had) to the same GitHub-secret mechanism the real
            # API keys already use. Printed in full here either way (not
            # a credential) so both the owner and any future session can
            # see its real current state on every deploy.
            echo "=== real MultiTalk two-speaker switch (MULTITALK_ENABLED) ==="
            if grep -q "^MULTITALK_ENABLED=..*" .env 2>/dev/null; then
              grep "^MULTITALK_ENABLED=" .env
            else
              echo "MULTITALK_ENABLED: not set in .env - defaults to OFF (config.py)"
            fi
            echo "=== real cinematic shot switch (CINEMATIC_SHOTS_ENABLED) ==="
            if grep -q "^CINEMATIC_SHOTS_ENABLED=..*" .env 2>/dev/null; then
              grep "^CINEMATIC_SHOTS_ENABLED=" .env
            else
              echo "CINEMATIC_SHOTS_ENABLED: not set in .env - defaults to OFF (config.py)"
            fi
