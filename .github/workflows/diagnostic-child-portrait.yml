name: Diagnostic - child portrait style test

# One-off, owner-authorized diagnostic ("اذنت بالاختبار"، 2026-10-22):
# real evidence showed one character's real portrait came back
# photorealistic and another's (a child) came back as a 3D-cartoon
# render, from the SAME PORTRAIT_STYLE_SUFFIX prompt suffix. Runs ONE
# real image generation against the exact real prompt shape production
# sends for a child character, to get real evidence instead of guessing.
# Manual trigger only (workflow_dispatch) - never runs on a normal push.
# Meant to be deleted once the real result has been read from the run's
# own log.
on:
  workflow_dispatch: {}

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Real flux-dev child-portrait test
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import time
          import urllib.request

          token = os.environ["REPLICATE_API_TOKEN"]
          # Exact real prompt shape production sends (dialogue_pipeline.py's
          # own _resolve_character_photo + PORTRAIT_STYLE_SUFFIX), for a
          # child character with a plausible real appearance description.
          appearance = "a young boy, around 8 years old, short curly black hair, light brown skin"
          scene = "the child runs into the kitchen where his mother is cooking dinner"
          suffix = (
              ", natural expression, looking directly at camera, photorealistic, "
              "shot on a DSLR, sharp focus, cinematic lighting - set within a real, "
              "lived-in location that fits the story (a home, a workplace, outdoors, "
              "wherever the story actually places them), never a plain studio backdrop "
              "or neutral background"
          )
          prompt = f"photorealistic portrait photo of {appearance}, in a scene from this real story: {scene}" + suffix
          print("=== real prompt sent ===")
          print(prompt)

          req = urllib.request.Request(
              "https://api.replicate.com/v1/models/black-forest-labs/flux-dev/predictions",
              data=json.dumps({"input": {"prompt": prompt}}).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              payload = json.load(resp)
          status_url = payload["urls"]["get"]
          print(f"=== submitted, id={payload.get('id')} ===")

          deadline = time.monotonic() + 300
          status_payload = None
          while time.monotonic() < deadline:
              req = urllib.request.Request(status_url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  status_payload = json.load(resp)
              status = status_payload.get("status")
              print(f"status: {status}")
              if status == "succeeded":
                  break
              if status in ("failed", "canceled"):
                  raise SystemExit(f"prediction {status}: {status_payload}")
              time.sleep(3)
          else:
              raise SystemExit("timed out waiting for prediction")

          print("=== REAL OUTPUT (this is the evidence) ===")
          print(json.dumps(status_payload.get("output"), ensure_ascii=False))
          print("=== real metrics ===")
          print(json.dumps(status_payload.get("metrics", {}), ensure_ascii=False))
          PYEOF
